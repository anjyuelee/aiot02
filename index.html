<!DOCTYPE html>
<html lang="zh-TW" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>李安爵 | Lee An Jyue</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header class="top">
      <div class="name">
        <h1>李安爵</h1>
        <p class="en">Lee An Jyue</p>
      </div>
      <button id="locationBtn" class="chip" type="button" aria-haspopup="dialog" aria-expanded="false">
        <span aria-hidden="true">📍</span>
        <span id="locationName">—</span>
        <span class="chevron" aria-hidden="true">▾</span>
      </button>
    </header>

    <section class="clock" aria-label="現在時間">
      <time id="date"></time>
      <time id="time"></time>
    </section>

    <section id="weather" class="card" data-state="loading" aria-label="目前天氣" aria-live="polite">
      <div class="weather-body">
        <div class="weather-main">
          <span id="wIcon" class="w-icon skeleton" aria-hidden="true"></span>
          <div class="w-temp-block">
            <span id="wTemp" class="w-temp skeleton"></span>
            <span id="wLabel" class="w-label skeleton"></span>
            <span id="wFeels" class="w-feels skeleton"></span>
          </div>
        </div>
        <ul class="weather-stats">
          <li><span class="stat-icon" aria-hidden="true">💧</span><span class="stat-name">濕度</span><span id="wHumidity" class="stat-value skeleton"></span></li>
          <li><span class="stat-icon" aria-hidden="true">💨</span><span class="stat-name">風速</span><span id="wWind" class="stat-value skeleton"></span></li>
          <li><span class="stat-icon" aria-hidden="true">☂️</span><span class="stat-name">降雨</span><span id="wRain" class="stat-value skeleton"></span></li>
        </ul>
        <div class="weather-footer">
          <span id="wUpdated" class="updated"></span>
          <button id="refreshBtn" class="icon-btn" type="button" aria-label="重新整理天氣">↻</button>
        </div>
      </div>
      <div class="weather-error">
        <p>天氣資料載入失敗</p>
        <button id="retryBtn" class="btn" type="button">重試</button>
      </div>
    </section>

    <p id="hint" class="hint" hidden></p>
  </main>

  <div id="backdrop" class="backdrop" hidden></div>
  <div id="locationDialog" class="dialog" role="dialog" aria-modal="true" aria-label="選擇地區" tabindex="-1" hidden>
    <div class="dialog-head">
      <h2>選擇地區</h2>
      <button id="closeDialogBtn" class="icon-btn" type="button" aria-label="關閉">✕</button>
    </div>
    <button id="useGeoBtn" class="btn geo-btn" type="button">📍 使用目前位置</button>
    <p id="geoError" class="geo-error" hidden></p>
    <div id="cityGrid" class="city-grid"></div>
  </div>
</body>
</html>
